name: krx-highs
# 평일 장 마감 후 KRX 20일·60일 신고가 계산. 16:07 KST 1차, 18:37 KST 2차(GitHub 스케줄 지연 대비).
# 이미 그날 파일이 있으면 건너뛰므로 두 번 돌아도 텔레그램은 한 번만 간다. 휴장일도 자동으로 건너뜀.
on:
  schedule:
    - cron: '7 7 * * 1-5'
    - cron: '37 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  highs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests pandas
      - run: python scripts/krx_highs.py
      - name: commit
        run: |
          git config user.name "invest-hub-bot"
          git config user.email "invest-hub-bot@users.noreply.github.com"
          git add docs/highs data/highs
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "highs: $(ls docs/highs/days | tail -1 | cut -c1-10)"
          git pull --rebase origin main
          git push origin HEAD:main
